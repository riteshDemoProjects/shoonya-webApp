       elements that survive: the green canopy and the cyan wave, inside a
       capsule echoing the badge's silhouette. Both use the logo's own paths;
       the translate/scale pairs are the explicit form of a "xMidYMid meet"
       fit, since nested <svg> positioning renders inconsistently. -->
